<head>

<meta name="description" content="Handcrafted pieces from vintage kimono silk. 着物の絹から生まれる一点もの。着物買取も承ります。">

</head>
<body data-page="kaitori" data-title="nav_kaitori">
<div id="hdr"></div>
<main>
<div class="page-top"><div class="wrap"><span class="eyebrow">KAI</span><h1 data-i18n="kai_h"></h1><div class="rule"></div><p style="color:var(--muted)" data-i18n="kai_sub"></p></div></div>
<section style="padding-top:10px"><div class="wrap"><div class="split"><div class="ph rv" data-img="images/kaitori.jpg"></div><div class="rv"><p data-i18n="kai_lead"></p><h3 style="margin-top:22px" data-i18n="kai_items_h"></h3><p style="color:var(--muted)" data-i18n="kai_items"></p><p style="margin-top:18px"><a class="btn solid" href="#form" data-i18n="home_kaitori_cta"></a></p></div></div></div></section>
<section class="alt"><div class="wrap"><div class="sec-head"><h2 data-i18n="kai_flow_h"></h2><div class="rule"></div></div><div class="steps">
<div class="rv"><h3 data-i18n="kai_s1_h"></h3><p data-i18n="kai_s1_t"></p></div><div class="rv"><h3 data-i18n="kai_s2_h"></h3><p data-i18n="kai_s2_t"></p></div><div class="rv"><h3 data-i18n="kai_s3_h"></h3><p data-i18n="kai_s3_t"></p></div><div class="rv"><h3 data-i18n="kai_s4_h"></h3><p data-i18n="kai_s4_t"></p></div>
</div><div class="box-s rv" style="margin-top:34px"><h3 data-i18n="kai_photo_h"></h3><p style="color:var(--muted)" data-i18n="kai_photo_t"></p></div></div></section>
<section id="form"><div class="wrap narrow"><div class="sec-head"><h2 data-i18n="kai_form_h"></h2><div class="rule"></div></div>
<form id="kaiForm" class="box-s" autocomplete="on">
<div class="row"><div><label data-i18n="f_name"></label><input name="name" required></div><div><label data-i18n="f_email"></label><input type="email" name="email" required></div></div>
<div class="row"><div><label data-i18n="f_phone"></label><input name="phone"></div><div><label data-i18n="f_zip"></label><input name="zip"></div></div>
<label data-i18n="f_addr"></label><input name="address">
<label data-i18n="k_count"></label><input name="items" required placeholder="例: 振袖 2枚 / Furisode ×2, Obi ×3">
<label data-i18n="k_photos"></label><input type="file" id="kPhotos" name="photos" accept="image/*" multiple><div class="previews" id="kPrev"></div>
<label data-i18n="k_method"></label><select name="method"><option value="ship" data-i18n="k_ship"></option><option value="visit" data-i18n="k_visit"></option></select>
<label data-i18n="k_cond"></label><textarea name="notes"></textarea>
<input class="hp" name="website" tabindex="-1" autocomplete="off">
<p class="note" style="margin-top:14px" data-i18n="kai_license"></p>
<p style="margin-top:18px"><button type="submit" class="btn solid" data-i18n="send"></button></p><div class="msg" id="kMsg"></div></form></div></section>
<section class="alt"><div class="wrap narrow"><div class="sec-head"><h2 data-i18n="kai_faq_h"></h2><div class="rule"></div></div>
<div class="box-s rv" style="margin-bottom:14px"><h3 data-i18n="kai_faq1_q"></h3><p style="color:var(--muted);margin-top:6px" data-i18n="kai_faq1_a"></p></div><div class="box-s rv" style="margin-bottom:14px"><h3 data-i18n="kai_faq2_q"></h3><p style="color:var(--muted);margin-top:6px" data-i18n="kai_faq2_a"></p></div><div class="box-s rv" style="margin-bottom:14px"><h3 data-i18n="kai_faq3_q"></h3><p style="color:var(--muted);margin-top:6px" data-i18n="kai_faq3_a"></p></div>
</div></section>
</main>
<div id="newsletter"></div>
<div id="ftr"></div>
