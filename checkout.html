<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUITSU</title>
<meta name="description" content="Handcrafted pieces from vintage kimono silk. 着物の絹から生まれる一点もの。着物買取も承ります。">
<link rel="alternate" hreflang="en" href="?lang=en"><link rel="alternate" hreflang="ja" href="?lang=jp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout" data-title="checkout">
<div id="hdr"></div>
<main>
<div class="page-top"><div class="wrap"><span class="eyebrow">Checkout</span><h1 data-i18n="co_h"></h1><div class="rule"></div><p style="color:var(--muted)" data-i18n="pay_note"></p></div></div>
<section style="padding-top:10px"><div class="wrap"><div class="co">
<form id="coForm" class="box-s"><h3 data-i18n="co_info"></h3>
<div class="row"><div><label data-i18n="f_name"></label><input name="name" required></div><div><label data-i18n="f_email"></label><input type="email" name="email" required></div></div>
<div class="row"><div><label data-i18n="f_phone"></label><input name="phone" required></div><div><label data-i18n="f_country"></label><select name="country"><option>Japan</option><option>United States</option><option>Indonesia</option><option>Singapore</option><option>Other</option></select></div></div>
<div class="row"><div><label data-i18n="f_zip"></label><input name="zip" required></div><div><label data-i18n="f_addr"></label><input name="address" required></div></div>
<label data-i18n="f_pay"></label><div class="pay"><label><input type="radio" name="pay" value="paypal" checked><span data-i18n="pay_paypal"></span><small data-i18n="pay_paypal_s"></small></label><label><input type="radio" name="pay" value="bank"><span data-i18n="pay_bank"></span><small data-i18n="pay_bank_s"></small></label><label><input type="radio" name="pay" value="card"><span data-i18n="pay_card"></span><small data-i18n="pay_card_s"></small></label><label data-cod><input type="radio" name="pay" value="cod"><span data-i18n="pay_cod"></span><small data-i18n="pay_cod_s"></small></label></div><div class="chips"><span>PayPal</span><span>VISA</span><span>Mastercard</span><span>JCB</span><span>Bank</span></div>
<label data-i18n="f_note"></label><textarea name="note" style="min-height:80px"></textarea><input class="hp" name="website" tabindex="-1" autocomplete="off">
<label style="display:flex;gap:8px;align-items:center;margin-top:16px"><input type="checkbox" required style="width:auto"><span data-i18n="agree"></span></label>
<p style="margin-top:18px"><button type="submit" class="btn solid" data-i18n="place_order"></button></p><div class="msg" id="coMsg"></div></form>
<div class="box-s" id="sumBox"><h3 data-i18n="cart"></h3><div id="coSum"></div></div></div>
<div id="done" hidden class="box-s center" style="max-width:560px;margin:0 auto"><h2 data-i18n="order_done_h"></h2><div class="rule"></div><p><span data-i18n="order_done_t"></span> <b id="doneId"></b></p><h3 style="margin-top:22px" data-i18n="pay_how_h"></h3><div class="payhow" id="payHow"></div><div id="payBtn"></div><p class="note" style="margin-top:18px" data-i18n="order_done_n"></p><p class="note" id="demoNote" hidden data-i18n="demo_mode"></p><p style="margin-top:20px"><a class="btn dark" href="shop.html" data-i18n="nav_shop"></a></p></div></div></section>
</main>
<div id="newsletter"></div>
<div id="ftr"></div>
<script src="js/config.js"></script><script src="js/i18n.js"></script><script src="js/app.js"></script>
</body></html>
