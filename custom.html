<head>

<body data-page="custom" data-title="nav_custom">
<div id="hdr"></div>
<main>
<div class="page-top"><div class="wrap"><span class="eyebrow">Custom</span><h1 data-i18n="cu_h"></h1><div class="rule"></div><p style="color:var(--muted)" data-i18n="cu_page_sub"></p></div></div>
<section style="padding-top:10px"><div class="wrap"><div class="split"><div class="ph rv" data-img="images/kaitori.jpg"></div><div class="rv"><p data-i18n="cu_lead"></p><p style="margin-top:18px"><a class="btn solid" href="#form" data-i18n="cu_cta"></a></p></div></div></div></section>
<section class="alt"><div class="wrap"><div class="steps">
<div class="rv"><h3 data-i18n="cu_s1_h"></h3><p data-i18n="cu_s1_t"></p></div><div class="rv"><h3 data-i18n="cu_s2_h"></h3><p data-i18n="cu_s2_t"></p></div><div class="rv"><h3 data-i18n="cu_s3_h"></h3><p data-i18n="cu_s3_t"></p></div><div class="rv"><h3 data-i18n="cu_s4_h"></h3><p data-i18n="cu_s4_t"></p></div>
</div></div></section>
<section id="form"><div class="wrap narrow"><div class="sec-head"><h2 data-i18n="cu_form_h"></h2><div class="rule"></div></div>
<form id="kaiForm" class="box-s" autocomplete="on">
<input type="hidden" name="method" value="custom-abaya">
<div class="row"><div><label data-i18n="f_name"></label><input name="name" required></div><div><label data-i18n="f_email"></label><input type="email" name="email" required></div></div>
<div class="row"><div><label data-i18n="f_phone"></label><input name="phone"></div><div><label data-i18n="f_zip"></label><input name="zip"></div></div>
<label data-i18n="f_addr"></label><input name="address">
<label data-i18n="cu_items"></label><input name="items" required>
<label data-i18n="k_photos"></label><input type="file" id="kPhotos" name="photos" accept="image/*" multiple><div class="previews" id="kPrev"></div>
<label data-i18n="cu_notes"></label><textarea name="notes"></textarea>
<input class="hp" name="website" tabindex="-1" autocomplete="off">
<p style="margin-top:18px"><button type="submit" class="btn solid" data-i18n="send"></button></p><div class="msg" id="kMsg"></div></form></div></section>

<div id="newsletter"></div>
<div id="ftr"></div>
